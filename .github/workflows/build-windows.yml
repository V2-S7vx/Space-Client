name: Build Space Client for Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build launcher with Gradle
        run: gradle clean jar --no-daemon

      - name: Create Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          magick assets/space-client-icon.svg -background none -density 192 -resize 256x256 build/space-client.png
          magick build/space-client.png -define icon:auto-resize=256,128,64,48,32,16 build/space-client.ico

      - name: Create self-contained launcher image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/jpackage | Out-Null
          jpackage --type app-image --name "Space Client" --app-version 0.1.0 --vendor "Space Client" --description "Space Client Minecraft launcher" --input build/libs --main-jar space-client-launcher-0.1.0.jar --main-class com.spaceclient.launcher.Main --icon build/space-client.ico --dest build/jpackage

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer EXE
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc installer\SpaceClient.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Put installer into ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/release | Out-Null
          Compress-Archive -Path build/installer/SpaceClient-Setup.exe -DestinationPath build/release/SpaceClient-Windows.zip -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Space-Client-Windows
          path: build/release/SpaceClient-Windows.zip
          if-no-files-found: error
